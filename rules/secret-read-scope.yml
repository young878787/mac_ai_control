id: secret-read-scope
language: python
severity: error
message: .env 設定（含金鑰）只能在 cloud_client、search_client、local_actions.get_weather 讀（ADR 0010、0021、0022，紅線 10）
note: |
  AI_API_KEY 只在 cloud_client、BRAVE_API_KEY 只在 search_client、CWA_API_KEY 只在 get_weather 讀，
  而且不進 os.environ、log 或錯誤訊息。新增要讀 .env 的地方等同改決策，先問使用者再更新本規則。
files:
  - mac_ai/**/*.py
  - main.py
  - build_vocab.py
  - scripts/**/*.py
  - bench/**/*.py
ignores:
  - mac_ai/config.py
  - mac_ai/router/cloud_client.py
  - mac_ai/router/search_client.py
rule:
  kind: call
  has:
    field: function
    regex: (^|\.)env_value$
  not:
    inside:
      stopBy: end
      kind: function_definition
      has: { field: name, regex: ^get_weather$ }
