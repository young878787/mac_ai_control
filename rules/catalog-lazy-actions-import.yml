id: catalog-lazy-actions-import
language: python
severity: error
message: catalog 只能在函式內 import actions，頂層匯入會循環：actions → llm_client → tools → catalog（AGENTS.md「不要碰」）
note: 見 AGENTS.md「不要碰」與 catalog._scan_installed。
files:
  - mac_ai/router/catalog.py
rule:
  any:
    - kind: import_from_statement
      has: { field: module_name, regex: ^mac_ai\.router\.actions$ }
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: ^mac_ai\.router$ }
        - has: { stopBy: end, kind: identifier, regex: ^actions$ }
    - kind: import_statement
      has: { stopBy: end, kind: dotted_name, regex: ^mac_ai\.router\.actions$ }
  not:
    inside: { kind: function_definition, stopBy: end }
