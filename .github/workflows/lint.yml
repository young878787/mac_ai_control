# Lint 與桌面端檢查：Ruff（Python）、ESLint＋自訂規則、typecheck、node --test（含自訂規則的測試）。
# pytest 依賴 mlx 等 Apple 限定套件，不在這裡跑；見 docs/guides/testing.md。
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0   # 這個 action 沒有浮動的 v10 標籤，要寫完整版號
      - run: uvx ruff@0.17.6 check . --output-format github

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # 只跑 lint／typecheck／node --test，不需要 Electron 執行檔
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
