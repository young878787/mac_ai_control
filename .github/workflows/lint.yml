# Lint 與桌面端檢查：Ruff（Python）、ast-grep 專案規則（Python，rules/）、import-linter 依賴契約（.importlinter）、程式檔行數上限、ESLint＋自訂規則、typecheck、node --test（含自訂規則的測試）。
# pytest 依賴 mlx 等 Apple 限定套件，不在這裡跑；見 docs/guides/testing.md。
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0   # 這個 action 沒有浮動的 v10 標籤，要寫完整版號
      - run: uvx ruff@0.17.6 check . --output-format github

  ast-grep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx --from ast-grep-cli@0.51.2 ast-grep test        # 規則本身的 valid／invalid 案例
      - run: uvx --from ast-grep-cli@0.51.2 ast-grep scan --format github

  import-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx --from import-linter==2.16 --with grimp==3.19 lint-imports   # 讀 repo 根目錄的 .importlinter；純靜態分析，不需要 mlx

  file-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_file_lines.py   # 程式檔（含測試）超過 800 行即失敗；見 ADR 0028

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # 只跑 lint／typecheck／node --test，不需要 Electron 執行檔
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
