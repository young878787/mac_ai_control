[pytest]
pythonpath = .
testpaths = tests
markers =
    live: 需要 mlx_vlm.server 已啟動並載入模型（預設 skip，跑法: pytest -m live）
    cloud: 連真的雲端模型（需 .env 金鑰，會產生費用；預設 skip，跑法: pytest -m cloud -s）
    app: 在真實 App（Safari、Finder、Terminal、VS Code）上執行並讀回狀態，會佔用螢幕（預設 skip，跑法: pytest -m app）
addopts = -m "not live and not app and not cloud"
